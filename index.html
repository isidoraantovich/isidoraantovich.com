<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Something beautiful is coming soon." />

  <title>Coming Soon ♡</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500&display=swap');

    :root {
      --pink: #e99aae;
      --deep-pink: #c96f89;
      --text: #684853;
      --muted: #a67b87;
      --white: rgba(255, 255, 255, 0.72);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 15%, rgba(244, 184, 199, .35), transparent 28%),
        radial-gradient(circle at 85% 80%, rgba(237, 165, 185, .25), transparent 30%),
        linear-gradient(135deg, #fffafa 0%, #fdf0f3 50%, #fff8f7 100%);
      font-family: "DM Sans", sans-serif;
    }

    .page {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      isolation: isolate;
    }

    /* Decorative branches */
    .branch {
      position: absolute;
      width: 260px;
      height: 420px;
      opacity: .55;
      z-index: -1;
      pointer-events: none;
    }

    .branch::before {
      content: "";
      position: absolute;
      width: 2px;
      height: 360px;
      background: linear-gradient(
        to bottom,
        transparent,
        #d99aaa,
        #d99aaa,
        transparent
      );
      transform: rotate(28deg);
      left: 50%;
      top: 30px;
    }

    .branch.left {
      left: -90px;
      top: -50px;
      transform: rotate(-18deg);
    }

    .branch.right {
      right: -90px;
      bottom: -80px;
      transform: rotate(162deg);
    }

    .leaf {
      position: absolute;
      width: 34px;
      height: 18px;
      border-radius: 100% 0 100% 0;
      background: #e9b3c0;
      transform: rotate(var(--r));
    }

    .leaf:nth-child(1) {
      left: 72px;
      top: 90px;
      --r: -25deg;
    }

    .leaf:nth-child(2) {
      left: 132px;
      top: 135px;
      --r: 155deg;
    }

    .leaf:nth-child(3) {
      left: 55px;
      top: 185px;
      --r: -35deg;
    }

    .leaf:nth-child(4) {
      left: 145px;
      top: 230px;
      --r: 150deg;
    }

    .leaf:nth-child(5) {
      left: 85px;
      top: 280px;
      --r: -30deg;
    }

    /* Floating petals */
    .petal {
      position: absolute;
      width: 12px;
      height: 19px;
      border-radius: 80% 20% 80% 20%;
      background: rgba(226, 136, 158, .4);
      animation: float 7s ease-in-out infinite;
      pointer-events: none;
    }

    .petal:nth-child(1) {
      top: 18%;
      left: 24%;
      animation-delay: -2s;
    }

    .petal:nth-child(2) {
      top: 72%;
      left: 17%;
      animation-delay: -5s;
    }

    .petal:nth-child(3) {
      top: 26%;
      right: 22%;
      animation-delay: -1s;
    }

    .petal:nth-child(4) {
      top: 80%;
      right: 25%;
      animation-delay: -4s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(15deg);
      }

      50% {
        transform: translateY(-22px) rotate(55deg);
      }
    }

    /* Main card */
    .card {
      width: min(720px, 100%);
      padding: 75px 50px;
      text-align: center;
      background: var(--white);
      border: 1px solid rgba(255, 255, 255, .9);
      border-radius: 32px;
      box-shadow:
        0 30px 80px rgba(178, 111, 130, .12),
        inset 0 1px 0 rgba(255,255,255,.9);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      animation: appear 1.1s ease both;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Flower */
    .flower {
      position: relative;
      width: 68px;
      height: 68px;
      margin: 0 auto 28px;
    }

    .flower span {
      position: absolute;
      width: 30px;
      height: 38px;
      background: #e9a0b3;
      border-radius: 50% 50% 45% 45%;
      left: 19px;
      top: 1px;
      transform-origin: 15px 33px;
    }

    .flower span:nth-child(1) { transform: rotate(0deg); }
    .flower span:nth-child(2) { transform: rotate(72deg); }
    .flower span:nth-child(3) { transform: rotate(144deg); }
    .flower span:nth-child(4) { transform: rotate(216deg); }
    .flower span:nth-child(5) { transform: rotate(288deg); }

    .flower::after {
      content: "";
      position: absolute;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #e2a14f;
      left: 26px;
      top: 27px;
      box-shadow: 0 0 0 5px rgba(255,255,255,.35);
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: .28em;
      font-size: 11px;
      font-weight: 500;
      color: var(--deep-pink);
      margin-bottom: 14px;
    }

    h1 {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(62px, 10vw, 104px);
      line-height: .8;
      font-weight: 500;
      color: #6d4652;
      letter-spacing: -.045em;
      margin-bottom: 25px;
    }

    .subtitle {
      max-width: 480px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }

    .footer {
      margin-top: 38px;
      font-family: "Cormorant Garamond", serif;
      font-size: 16px;
      color: #b58a96;
    }

    .heart {
      color: #d9829a;
      display: inline-block;
      animation: heartbeat 1.8s ease-in-out infinite;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }

      15% {
        transform: scale(1.18);
      }

      30% {
        transform: scale(1);
      }
    }

    @media (max-width: 600px) {
      .page {
        padding: 18px;
      }

      .card {
        padding: 60px 24px;
        border-radius: 26px;
      }

      h1 {
        font-size: 66px;
      }

      .subtitle {
        font-size: 14px;
      }

      .branch {
        opacity: .25;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <!-- Decorative branches -->
    <div class="branch left">
      <div class="leaf"></div>
      <div class="leaf"></div>
      <div class="leaf"></div>
      <div class="leaf"></div>
      <div class="leaf"></div>
    </div>

    <div class="branch right">
      <div class="leaf"></div>
      <div class="leaf"></div>
      <div class="leaf"></div>
      <div class="leaf"></div>
      <div class="leaf"></div>
    </div>

    <!-- Floating petals -->
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>

    <section class="card">

      <div class="flower" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>

      <p class="eyebrow">A little something is blooming</p>

      <h1>Coming Soon</h1>

      <p class="subtitle">
        We’re putting the finishing touches on something lovely.
        Stay close — something beautiful is on its way.
      </p>

      <p class="footer">
        Made with <span class="heart">♡</span> & a little magic
      </p>

    </section>

  </main>

  <script>
    // Small subtle interaction: gently move petals with the cursor.
    const petals = document.querySelectorAll(".petal");

    document.addEventListener("mousemove", (event) => {
      const x = (event.clientX / window.innerWidth - 0.5) * 10;
      const y = (event.clientY / window.innerHeight - 0.5) * 10;

      petals.forEach((petal, index) => {
        const amount = (index + 1) * 0.35;
        petal.style.marginLeft = `${x * amount}px`;
        petal.style.marginTop = `${y * amount}px`;
      });
    });
  </script>

</body>
</html>
